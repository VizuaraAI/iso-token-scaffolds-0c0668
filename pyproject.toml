[project]
name = "iso-token-scaffolds"
version = "0.1.0"
description = "Evaluating inference scaffolds at matched total token cost"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ashish Ranjan" }]
dependencies = [
  "numpy>=2.1",
  "pyyaml>=6.0",
  "matplotlib>=3.9",
  "tqdm>=4.66",
  "datasets>=3.2",
  "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
gpu = [
  "torch>=2.5",
  "transformers>=4.48",
  "accelerate>=1.3",
  "vllm>=0.7.0",
  "openai>=1.60",
  "sentence-transformers>=3.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
